services:
  postgres:
    image: postgres:16
    container_name: tripplanner-db
    environment:
      POSTGRES_DB: tripplannerdb
      POSTGRES_USER: tripplanner
      POSTGRES_PASSWORD: tripplanner123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: